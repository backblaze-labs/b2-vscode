name: Doc Gardening

# Scheduled drift backstop for the AGENTS.md + docs/ system of record and the
# architecture layering. The same gates run on every PR via Code Quality; this
# catches drift that reaches main another way (e.g. a direct push) and surfaces
# it as a visible scheduled failure.
#
# Schedule / manual only, so it is not Dependabot-reachable and needs no
# Dependabot guard (see docs/design-docs/conventions.md#ci-invariants).

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-scan:
    name: Layer & doc drift scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false

      - name: Check architecture layers
        run: node scripts/assert-layers.js

      - name: Check doc-drift (links, anchors, required files)
        run: node scripts/assert-docs.js
